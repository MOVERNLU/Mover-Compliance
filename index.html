<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Control Bot — Mover</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #2ec4a5;
      --teal-dark: #25a98d;
      --teal-light: #e8f9f5;
      --navy: #0a3d5c;
      --navy-light: #0d4a6e;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f3f4f6;
      --white: #ffffff;
      --red: #ef4444;
      --red-light: #fef2f2;
      --green: #22c55e;
      --green-light: #f0fdf4;
      --yellow: #f59e0b;
      --yellow-light: #fffbeb;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP BAR ─────────────────────────────────────────── */
    header {
      background: #0a3d5c;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

        .header-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
    }

    .header-title {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      display: inline-block;
    }

    .header-right {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    /* ── MAIN ─────────────────────────────────────────────── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── STAT CARDS ───────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--teal);
    }

    .stat-value.dark { color: var(--text); }

    /* ── SEARCH SECTION ───────────────────────────────────── */
    .search-section {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 32px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    .id-input {
      flex: 1;
      height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    .id-input::placeholder { color: #b0b7c3; }
    .id-input:focus { border-color: var(--teal); }

    .btn-check {
      height: 44px;
      padding: 0 24px;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn-check:hover { background: var(--teal-dark); }
    .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      height: 44px;
      padding: 0 20px;
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-outline:hover { border-color: var(--teal); color: var(--teal); }

    /* ── SPINNER ──────────────────────────────────────────── */
    .spinner-wrap {
      display: none;
      justify-content: center;
      align-items: center;
      padding: 48px;
    }

    .spinner-wrap.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESULTS ──────────────────────────────────────────── */
    .results {
      display: none;
    }

    .results.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .result-id-badge {
      font-size: 12px;
      background: var(--navy);
      color: rgba(255,255,255,0.8);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* overall status banner */
    .status-banner {
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .status-banner.compliant   { background: var(--green-light); color: #166534; border: 1px solid #bbf7d0; }
    .status-banner.warning     { background: var(--yellow-light); color: #92400e; border: 1px solid #fde68a; }
    .status-banner.non-compliant { background: var(--red-light); color: #991b1b; border: 1px solid #fecaca; }

    .status-icon { font-size: 20px; }

    /* check list */
    .check-list {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .check-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
      transition: background 0.1s;
    }

    .check-item:last-child { border-bottom: none; }
    .check-item:hover { background: #fafafa; }

    .check-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .check-icon.pass    { background: var(--green-light); color: var(--green); }
    .check-icon.fail    { background: var(--red-light);   color: var(--red);   }
    .check-icon.warn    { background: var(--yellow-light); color: var(--yellow); }
    .check-icon.pending { background: var(--bg); color: var(--text-muted); }

    .check-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .check-detail {
      font-size: 13px;
      color: var(--text-muted);
    }

    .check-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .check-tag.pass { background: var(--green-light); color: #166534; }
    .check-tag.fail { background: var(--red-light); color: #991b1b; }
    .check-tag.warn { background: var(--yellow-light); color: #92400e; }
    .check-tag.pending { background: var(--bg); color: var(--text-muted); }

    /* ── ERROR STATE ──────────────────────────────────────── */
    .error-box {
      display: none;
      background: var(--red-light);
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 16px 20px;
      color: #991b1b;
      font-size: 14px;
      margin-top: 16px;
    }

    .error-box.visible { display: block; }

    /* ── EMPTY STATE ──────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-text {
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

      <div class="header-title">
        Compliance Control Bot
        <span class="status-dot"></span>
      </div>
    </div>
    <div class="header-right">NikolajLund/Mover-Compliance</div>
  </header>

  <main>

    <!-- Stat cards -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Checks Run Today</div>
        <div class="stat-value" id="stat-today">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Checked ID</div>
        <div class="stat-value dark" id="stat-last">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Non-Compliant Found</div>
        <div class="stat-value" id="stat-fail">0</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-section">
      <div class="section-title">Check Compliance by ID</div>
      <div class="search-row">
        <input
          class="id-input"
          id="id-input"
          type="text"
          placeholder="Enter user ID — e.g. 2218134"
          autocomplete="off"
        />
        <button class="btn-check" id="btn-check" onclick="runCheck()">Check</button>
        <button class="btn-outline" onclick="clearResults()">Clear</button>
      </div>
      <div class="error-box" id="error-box"></div>
    </div>

    <!-- Loading -->
    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <div class="result-header">
        <div class="result-title">Compliance Report</div>
        <div class="result-id-badge" id="result-id-badge">ID: —</div>
      </div>

      <div class="status-banner" id="status-banner">
        <span class="status-icon" id="status-icon"></span>
        <span id="status-text"></span>
      </div>

      <div class="check-list" id="check-list"></div>
    </div>

    <!-- Empty state (shown before first check) -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">
        Enter a user ID above to run a compliance check.<br/>
        Results will appear here.
      </div>
    </div>

  </main>

  <script>
    const GITHUB_TOKEN = "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";
    const REPO         = "MOVERNLU/Mover-Compliance";
    const WORKFLOW     = "compliance.yml";
    const API          = "https://api.github.com";

    let checksToday = 0;
    let failCount   = 0;

    // ── Trigger workflow and poll for result ──────────────
    async function runCheck() {
      const input = document.getElementById('id-input');
      const id = input.value.trim();

      if (!id)           { showError('Please enter a user ID.'); return; }
      if (!/^\d+$/.test(id)) { showError('ID must be numeric.'); return; }

      hideError();
      showSpinner(true);
      hideResults();
      hideEmpty();

      try {
        // 1. Get current run count so we can detect the new run
        const beforeRuns = await getRuns();
        const beforeIds  = new Set(beforeRuns.map(r => r.id));

        // 2. Trigger workflow
        await fetch(`${API}/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main', inputs: { user_id: id } })
        });

        // 3. Poll for the new run to complete (max 3 min)
        let run = null;
        for (let i = 0; i < 36; i++) {
          await sleep(5000);
          const runs = await getRuns();
          run = runs.find(r => !beforeIds.has(r.id));
          if (run && (run.status === 'completed' || run.conclusion)) break;
        }

        if (!run) throw new Error('Timeout — the workflow took too long. Please try again.');
        if (run.conclusion !== 'success') throw new Error(`Workflow failed: ${run.conclusion}`);

        // 4. Fetch result.json from repo
        const resultResp = await fetch(`${API}/repos/${REPO}/contents/result.json`, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        const resultData = await resultResp.json();
        const json = JSON.parse(atob(resultData.content));

        // 5. Render
        const results = Object.entries(json).map(([id, val]) => ({
          id,
          name: checkName(id),
          result: val
        }));

        checksToday++;
        document.getElementById('stat-today').textContent = checksToday;
        document.getElementById('stat-last').textContent = id;

        const fails = results.filter(r => r.result.status === 'fail').length;
        const warns = results.filter(r => r.result.status === 'warn').length;
        if (fails > 0) failCount++;
        document.getElementById('stat-fail').textContent = failCount;

        renderResults(id, results, fails, warns);

      } catch (err) {
        showError(`Error: ${err.message}`);
      } finally {
        showSpinner(false);
      }
    }

    async function getRuns() {
      const r = await fetch(
        `${API}/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=10`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' } }
      );
      const d = await r.json();
      return d.workflow_runs || [];
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function checkName(id) {
      const names = {
        chat_enabled: 'Chat enabled',
        user_active:  'Account active',
      };
      return names[id] || id;
    }

    function renderResults(id, results, fails, warns) {
      document.getElementById('result-id-badge').textContent = `ID: ${id}`;

      const banner = document.getElementById('status-banner');
      const icon   = document.getElementById('status-icon');
      const text   = document.getElementById('status-text');
      const list   = document.getElementById('check-list');

      if (fails > 0) {
        banner.className = 'status-banner non-compliant';
        icon.textContent = '✗';
        text.textContent = `Non-compliant — ${fails} check${fails > 1 ? 's' : ''} failed`;
      } else if (warns > 0) {
        banner.className = 'status-banner warning';
        icon.textContent = '⚠';
        text.textContent = `Attention — ${warns} punkt${warns > 1 ? 'er' : ''} kræver gennemgang`;
      } else {
        banner.className = 'status-banner compliant';
        icon.textContent = '✓';
        text.textContent = 'Compliant — all checks passed';
      }

      list.innerHTML = results.map(r => {
        const s = r.result.status;
        const icons = { pass: '✓', fail: '✗', warn: '⚠', pending: '–' };
        return `
          <div class="check-item">
            <div class="check-icon ${s}">${icons[s] || '–'}</div>
            <div class="check-name">${r.name}</div>
            <div class="check-detail">${r.result.detail || ''}</div>
            <div class="check-tag ${s}">${s}</div>
          </div>`;
      }).join('');

      document.getElementById('results').classList.add('visible');
    }

    function clearResults() {
      document.getElementById('id-input').value = '';
      hideResults();
      hideError();
      document.getElementById('empty-state').style.display = 'block';
    }

    function showSpinner(show) {
      document.getElementById('spinner').classList.toggle('visible', show);
    }
    function hideResults() {
      document.getElementById('results').classList.remove('visible');
    }
    function hideEmpty() {
      document.getElementById('empty-state').style.display = 'none';
    }
    function showError(msg) {
      const el = document.getElementById('error-box');
      el.textContent = msg;
      el.classList.add('visible');
    }
    function hideError() {
      document.getElementById('error-box').classList.remove('visible');
    }

    document.getElementById('id-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') runCheck();
    });
  </script>
</body>
